<div class="recent-section">
  <div class="section-head">
    <span class="section-title">Recently added</span>
    <span class="section-meta">last 10 uploaded</span>
  </div>

  <!-- Loading skeleton -->
  <div class="thumb-grid" *ngIf="images.length === 0">
    <div class="skeleton" *ngFor="let i of [1,2,3,4,5]"></div>
  </div>

  <!-- Real images from API -->
  <div class="thumb-grid" *ngIf="images.length > 0">
    <div class="thumb" *ngFor="let image of images">
      <span class="thumb-icon">🖼</span>
      <div class="thumb-label">
        {{ getSceneLabel(image) }} · {{ getYear(image.date_taken) }}
      </div>
    </div>
  </div>
</div>

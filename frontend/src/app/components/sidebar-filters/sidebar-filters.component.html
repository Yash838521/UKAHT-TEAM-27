<aside class="sidebar">
  <div class="sidebar-title">Filters</div>

  <!-- Scene type -->
  <div class="filter-section">
    <div class="filter-label">Scene type</div>
    <div
      class="filter-option"
      *ngFor="let opt of sceneOptions"
      [class.selected]="sceneType === opt.value"
      (click)="setScene(opt.value)"
    >
      <input type="radio" name="scene" [checked]="sceneType === opt.value"
        (click)="setScene(opt.value); $event.stopPropagation()"/>
      <span>{{ opt.label }}</span>
    </div>
  </div>

  <!-- People -->
  <div class="filter-section">
    <div class="filter-label">People</div>
    <div
      class="filter-option"
      *ngFor="let opt of peopleOptions"
      [class.selected]="peopleMin === opt.value"
      (click)="setPeople(opt.value)"
    >
      <input type="radio" name="people" [checked]="peopleMin === opt.value"
        (click)="setPeople(opt.value); $event.stopPropagation()"/>
      <span>{{ opt.label }}</span>
    </div>
  </div>

  <!-- Quality score -->
  <div class="filter-section">
    <div class="filter-label">Min quality score</div>
    <input type="range" class="filter-range" min="0" max="100"
      [value]="qualityMin * 100" (input)="onQualityChange($event)"/>
    <div class="filter-val">{{ qualityMin.toFixed(2) }} and above</div>
  </div>

  <!-- Date range -->
  <div class="filter-section">
    <div class="filter-label">Date range</div>
    <div
      class="filter-option"
      *ngFor="let opt of dateOptions"
      [class.selected]="isDateActive(opt.from, opt.to)"
      (click)="setDate(opt.from, opt.to)"
    >
      <input type="radio" name="date" [checked]="isDateActive(opt.from, opt.to)"
        (click)="setDate(opt.from, opt.to); $event.stopPropagation()"/>
      <span>{{ opt.label }}</span>
    </div>
  </div>

  <!-- Duplicates -->
  <div class="filter-section">
    <div class="filter-label">Duplicates</div>
    <div class="filter-option" [class.selected]="!noDuplicates" (click)="setDuplicates(false)">
      <input type="radio" name="dup" [checked]="!noDuplicates"
        (click)="setDuplicates(false); $event.stopPropagation()"/>
      <span>Show all</span>
    </div>
    <div class="filter-option" [class.selected]="noDuplicates" (click)="setDuplicates(true)">
      <input type="radio" name="dup" [checked]="noDuplicates"
        (click)="setDuplicates(true); $event.stopPropagation()"/>
      <span>Unique only</span>
    </div>
  </div>

  <!-- Tags grouped by facet -->
  <div class="filter-section">
    <div class="filter-label">Tags</div>
    <input type="text" class="tag-search" placeholder="Search tags…" [(ngModel)]="tagSearch"/>

    <ng-container *ngFor="let group of filteredFacetGroups()">
      <div class="facet-group">
        <div class="facet-label">{{ group.label }}</div>
        <div
          class="tag-item"
          *ngFor="let t of group.tags"
          [class.selected]="isTagSelected(t.tag)"
          (click)="toggleTag(t.tag)"
        >
          <div class="tag-item-left">
            <input type="checkbox" [checked]="isTagSelected(t.tag)"
              (click)="toggleTag(t.tag); $event.stopPropagation()"/>
            <span>{{ t.tag }}</span>
          </div>
          <span class="tag-count">{{ t.count }}</span>
        </div>
      </div>
    </ng-container>

    <div class="empty-tags" *ngIf="filteredFacetGroups().length === 0">
      No tags match "{{ tagSearch }}"
    </div>
  </div>

  <button class="apply-btn" (click)="onApply()">Apply filters</button>
  <button class="clear-btn" (click)="onClear()">Clear all</button>
</aside>

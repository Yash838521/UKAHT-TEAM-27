# .github/workflows/backend.yml
name: Backend CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - run: cd backend && npm install
      - run: cd backend && node -e "require('./src/server.js')" # syntax check